[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "phomreeb", email = "phomreebna@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "uuid6>=2025.0.1",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
